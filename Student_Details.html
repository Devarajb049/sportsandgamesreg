        <!-- Confirmation Modal -->
        <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel"

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirmSubmit">Confirm & Submit</button>
                    </div>
                </div>

    <script>document.addEventListener("DOMContentLoaded", function () {
            let pinField = document.getElementById("pin_num");
            let yearField = document.querySelector("select[name='year']");
            let branchField = document.querySelector("select[name='branch']");
            let phoneField = document.getElementById("phno");
            let form = document.getElementById("registrationForm");
            let confirmModal = new bootstrap.Modal(document.getElementById('confirmationModal'));
            let confirmSubmitButton = document.getElementById("confirmSubmit");

            // Function to auto-fill Year & Branch based on PIN
            pinField.addEventListener("input", function () {
                let pinValue = this.value.trim().toUpperCase(); // Convert input to uppercase
                let pinPattern = /^(\d{2})101-(CM|EC|EE|M)-(\d{3})$/i; // Case-insensitive regex
                let match = pinValue.match(pinPattern);

                if (match) {
                    let pinYear = match[1];  // Extract first two digits (year)
                    let pinBranch = match[2].toUpperCase(); // Extract branch code and convert to uppercase
                    let pinNumber = parseInt(match[3]); // Extract last 3 digits as a number

                    // Map the extracted year to academic year
                    let yearMapping = { "22": "3", "23": "2", "24": "1" };
                    let mappedYear = yearMapping[pinYear] || "";

                    // Map the extracted branch code
                    let branchMapping = { "CM": "DCME", "EC": "DECE", "EE": "DEEE", "M": "DME" };
                    let mappedBranch = branchMapping[pinBranch] || "";
                    if (!yearMapping[pinYear]) {
                        alert("Error: Invalid Year! Only PINs from 22, 23, and 24 are allowed.");
                        this.value = "";
                        resetFields();
                        return;
                    }
                    // Validate PIN Number Range based on Branch
                    let isValid = false;
                    if ((mappedBranch === "DCME" || mappedBranch === "DME") && pinNumber >= 0 && pinNumber <= 33) {
                        isValid = true;
                    } else if ((mappedBranch === "DECE" || mappedBranch === "DEEE") && pinNumber >= 0 && pinNumber <= 66) {
                        isValid = true;
                    }

                    if (!isValid) {
                        alert("Error: Invalid PIN NUMBER! Enter a valid PIN number.");
                        this.value = ""; 
                        yearField.value = "";
                        branchField.value = "";
                        yearField.disabled = false;
                        branchField.disabled = false;
                        return;
                    }

                    // Set dropdown values and disable them for manual selection
                    if (mappedYear) {
                        yearField.value = mappedYear;
                        yearField.disabled = true;
                    } else {
                        yearField.value = "";
                        yearField.disabled = false;
                    }

                    if (mappedBranch) {
                        branchField.value = mappedBranch;
                        branchField.disabled = true;
                    } else {
                        branchField.value = "";
                        branchField.disabled = false;
                    }
                } else {
                    // Reset if PIN format is incorrect
                    yearField.value = "";
                    branchField.value = "";
                    yearField.disabled = false;
                    branchField.disabled = false;
                }
            });

            // Show confirmation modal before submitting
            form.addEventListener("submit", function (event) {
                event.preventDefault(); // Stop form submission initially

                let studentName = document.getElementById("student_name").value.trim();
                let pinNum = pinField.value.trim().toUpperCase(); // Convert to uppercase before validation
                let year = yearField.value;
                let branch = branchField.value;
                let phone = phoneField.value.trim();

                // Validate input
                if (!/^(\d{2})101-(CM|EC|EE|M)-\d{3}$/i.test(pinNum)) {
                    alert("Error: Invalid PIN format! Use format: YY101-BB-NNN (e.g., YY101-BB-NNN).");
                    return;
                }

                if (year === "" || branch === "") {
                    alert("Error: Year or Branch is missing. Check PIN number.");
                    return;
                }

                if (!/^\d{10}$/.test(phone)) {
                    alert("Error: Enter a valid 10-digit mobile number.");
                    return;
                }

                let selectedGames = [];
                document.querySelectorAll(".form-check-input:checked").forEach(checkbox => {
                    selectedGames.push(checkbox.value);
                });

                if (selectedGames.length === 0) {
                    alert("Error: Please select at least one game before submitting.");
                    return;
                }

                // Fill modal with user details
                document.getElementById("confirmName").textContent = studentName;
                document.getElementById("confirmPin").textContent = pinNum;
                document.getElementById("confirmYear").textContent = year;
                document.getElementById("confirmBranch").textContent = branch;
                document.getElementById("confirmPhno").textContent = phone;
                document.getElementById("confirmGames").textContent = selectedGames.join(", ");

                // Show the modal
                confirmModal.show();
            });

            // Final submission after confirmation
            confirmSubmitButton.addEventListener("click", function () {
                form.submit();
            });

            // Go back to home page
            document.querySelector('.fa-arrow-left').addEventListener('click', function () {
                window.location.href = 'index.html';
            });

            // JavaScript for toggling checkboxes
            document.querySelectorAll(".toggle-label").forEach(label => {
                label.addEventListener("click", function () {
                    let targetId = this.getAttribute("data-target");
                    let checkboxes = document.getElementById(targetId);

                    // Close all other sections
                    document.querySelectorAll(".checkbox-container").forEach(container => {
                        if (container !== checkboxes) {
                            container.style.display = "none";
                        }
                    });

                    // Toggle the clicked section
                    checkboxes.style.display = checkboxes.style.display === "none" ? "block" : "none";
                    this.querySelector("i").classList.toggle("rotate");
                });
            });

            // Hide all checkboxes initially
            document.querySelectorAll(".checkbox-container").forEach(container => {
                container.style.display = "none";
            });

            // Add label highlighting for checked checkboxes
            document.querySelectorAll(".form-check-input").forEach(checkbox => {
                checkbox.addEventListener("change", function () {
                    const label = this.nextElementSibling;
                    if (this.checked) {
                        label.classList.add("checked-label");
                    } else {
                        label.classList.remove("checked-label");
                    }
                });
            });
        });


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
